# Local development convenience only — not part of the deployed architecture
# (production uses managed Postgres + managed Redis per architecture.md).
# Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildbridge
      POSTGRES_PASSWORD: buildbridge
      POSTGRES_DB: buildbridge
    ports:
      - '5432:5432'
    volumes:
      - buildbridge-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  buildbridge-postgres:
